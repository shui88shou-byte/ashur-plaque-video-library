<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>第 01 条播放核验｜阿舒尔 ASHUR</title><style>
:root{color-scheme:light;--ink:#18332f;--accent:#17594b;--paper:#faf9f4;--muted:#536660;--line:#c9d4cc}*{box-sizing:border-box}
body{margin:0;font:17px/1.65 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header,main,footer{width:min(820px,calc(100% - 36px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}header strong{font-size:24px;letter-spacing:-.05em}a{color:var(--accent);text-underline-offset:4px}h1{font-size:clamp(25px,4.6vw,42px);letter-spacing:-.035em;line-height:1.2;margin:12px 0 18px}main{padding:25px 0 34px}footer{padding:19px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}.meta{font-size:14px;color:var(--muted);margin:.5em 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px}.card{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:16px;text-decoration:none;background:white;color:var(--ink);padding:12px;border:1px solid var(--line);border-radius:12px}.card img{width:100px;height:144px;object-fit:contain;background:#142825;border-radius:6px}.card span{display:block}.player{background:#162827;border-radius:12px;overflow:hidden}video{width:100%;height:min(64vh,620px);display:block;object-fit:contain}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;margin-top:1em}.actions a,.actions button{font:inherit;font-size:15px}.actions button{border:1px solid var(--line);padding:.35em .9em;border-radius:1em;background:white;color:var(--accent);cursor:pointer}.stat{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0}.meter{font:600 clamp(18px,4vw,28px)/1.4 ui-monospace,monospace;display:block;overflow-wrap:anywhere}.testvideo{height:clamp(130px,25vh,240px)}[hidden]{display:none!important}
</style></head><body><header><a href="/ashur-plaque-video-library/" style="text-decoration:none"><strong>ASHUR</strong> 阿舒尔</a><a href="/ashur-plaque-video-library/">视频目录</a></header><main><h1>第 01 条 · 播放核验</h1><div class="stat"><strong id="status">等候播放器</strong><span class="meter" id="clock">等候视频时钟</span><small id="facts"></small><pre id="history" style="margin:4px 0;font-size:13px;line-height:1.3"></pre></div><div class="player"><video id="movie" controls playsinline preload="metadata" class="testvideo" autoplay muted poster="/ashur-plaque-video-library/posters/01.jpg"><source type="video/mp4" src="/ashur-plaque-video-library/media/01.mp4">请使用视频直链播放。</video></div><p class="meta">如浏览器阻止静音自动播放，可点击播放器播放。<a href="/ashur-plaque-video-library/clips/01.html">打开正式播放页</a></p><script>
const v=document.getElementById('movie');
let start=performance.now(), frameCount=null, mediaTime=null, first=null, lastLog=-Infinity, log=[], playResult='请求自动播放中';
const frameMethod=typeof v.requestVideoFrameCallback==='function'?'requestVideoFrameCallback':'getVideoPlaybackQuality';
function onFrame(_,m){frameCount=m.presentedFrames;mediaTime=m.mediaTime;v.requestVideoFrameCallback(onFrame)}
if(typeof v.requestVideoFrameCallback==='function')v.requestVideoFrameCallback(onFrame);
function read(){
  const wall=(performance.now()-start)/1000, t=v.currentTime;
  let n=frameCount;if(n===null && frameMethod==='getVideoPlaybackQuality' && typeof v.getVideoPlaybackQuality==='function'){const q=v.getVideoPlaybackQuality();n=q.totalVideoFrames-q.droppedVideoFrames;}
  if(first===null && n>0 && !v.paused) first={t,n};
  if(wall-lastLog>=.8){lastLog=wall;log.push([wall.toFixed(1),t.toFixed(3),n===null?'—':n]);if(log.length>3)log.shift();}
  const progressing=first!==null&&n-first.n>=3&&t-first.t>=.25&&!v.error;
  document.querySelector('#status').textContent=v.error?'播放器错误 '+v.error.code:progressing?'已观测到视频时间和画面帧数推进':v.paused?'播放器已暂停':'等候视频时钟与帧数变化';
  document.querySelector('#clock').textContent=t.toFixed(3)+' 秒 · '+(n===null?'尚未取得帧数':n+' 帧');
  document.querySelector('#facts').textContent=playResult+' · readyState '+v.readyState+' · '+v.videoWidth+'×'+v.videoHeight+' · '+(v.paused?'暂停':'播放')+' · '+frameMethod+(first?' · 首次播放采样 '+first.t.toFixed(3)+' 秒 / '+first.n+' 帧':'');
  document.querySelector('#history').textContent=log.map(a=>a[0]+'s  →  '+a[1]+' s / '+a[2]+' 帧').join('\n');
}
v.muted=true;
v.play().then(()=>{playResult='play() 已开始';read()}).catch(e=>{playResult=e.name;read()});
read();setInterval(read,250);v.addEventListener('error',read);
</script></main><footer>阿舒尔（天津）医疗器械有限公司 · 阿舒尔品牌方提供</footer></body></html>
